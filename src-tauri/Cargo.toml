[package]
name = "tauri-desktop-starter"
version = "0.1.0"
description = "A modern Tauri desktop application starter"
authors = ["you"]
license = "MIT"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_desktop_starter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
# release 构建没有控制台，日志必须落文件，否则线上问题无从查起
tauri-plugin-log = "2"
log = "0.4"
# 当前代码没有直接用到 serde，但 commands.rs 的文档示例（结构化错误 enum）
# 依赖 `#[derive(serde::Serialize)]`，删掉会让照着文档写的第一步就编译失败
serde = { version = "1", features = ["derive"] }

# 单实例只在桌面端有意义，移动端不编译这个 crate
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
