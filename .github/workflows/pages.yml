name: 在线演示

on:
  push:
    branches: [develop]
    paths:
      - src/**
      - public/**
      - resources/branding/app-icon.svg
      - resources/skins/**
      - app.config.json
      - index.html
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - tsconfig*.json
      - vite.config.ts
      - playwright.config.ts
      - e2e/browser/**
      - .nvmrc
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    name: 构建并部署在线演示
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: 安装依赖
        run: pnpm install --frozen-lockfile
      - name: 构建同源前端演示
        run: pnpm build:web
      - name: 安装浏览器测试环境
        run: pnpm exec playwright install --with-deps --only-shell chromium
      - name: 发布前验证子路径、偏好、fixture 与无障碍
        run: pnpm exec playwright test
      - name: 保留浏览器截图、性能采样与失败 trace
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pages-browser-smoke
          path: artifacts/browser
          if-no-files-found: ignore
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist-web
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
