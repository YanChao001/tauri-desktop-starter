name: 版本发布

# 打 tag 触发（v1.2.0），也可在 Actions 页面手动触发。
# 产物默认作为 draft Release 上传，人工确认后再发布。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  # SignPath 操作需要读取本次工作流运行的构建产物
  actions: read

# tag 与手动触发也可能指向同一版本，按仓库串行发布，避免交叉覆盖资产。
concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  validate:
    name: 校验发布代码
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: 验证发布代码属于主分支
        run: git merge-base --is-ancestor HEAD origin/main
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify

  build:
    name: 构建 ${{ matrix.platform }} ${{ matrix.args }}
    needs: validate
    strategy:
      # 保留其他平台的执行结果，分别定位平台问题
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: ""
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            target: x86_64-apple-darwin
            args: "--target x86_64-apple-darwin"
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: ""

    runs-on: ${{ matrix.platform }}
    outputs:
      updater-enabled: ${{ steps.updater.outputs.enabled }}

    steps:
      - uses: actions/checkout@v7

      - name: 安装 Linux 系统依赖
        if: matrix.platform == 'ubuntu-22.04'
        timeout-minutes: 8
        run: |
          printf 'https://archive.ubuntu.com/ubuntu/\tpriority:1\nhttps://security.ubuntu.com/ubuntu/\tpriority:2\n' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          apt=(sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
          "${apt[@]}" update
          "${apt[@]}" install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: 安装 Rust 工具链
        run: rustup toolchain install

      - name: 安装 macOS 编译目标
        if: matrix.platform == 'macos-latest'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 校验项目版本与 tag
        id: version
        run: node scripts/version.mjs check

      # 只在 secret 非空时写入环境变量：Tauri 用 env::var_os 判断是否签名，
      # 空字符串同样会被当成“已配置”，导致 macOS 签名流程拿到空证书直接失败。
      - name: 注入签名凭据
        shell: bash
        env:
          IN_APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          IN_APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          IN_APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          IN_APPLE_ID: ${{ secrets.APPLE_ID }}
          IN_APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          IN_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IN_UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          IN_UPDATER_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${IN_APPLE_CERTIFICATE:-}" ]; then
            for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
              input_name="IN_$name"
              value="${!input_name}"
              if [ -n "$value" ]; then
                {
                  echo "$name<<__ENV__"
                  echo "$value"
                  echo "__ENV__"
                } >> "$GITHUB_ENV"
              fi
            done
            echo "已注入 Apple 签名凭据"
          else
            echo "未配置 APPLE_CERTIFICATE，macOS 产物不签名、不公证"
          fi
          if [ -n "${IN_UPDATER_KEY:-}" ]; then
            {
              echo "TAURI_SIGNING_PRIVATE_KEY<<__ENV__"
              echo "$IN_UPDATER_KEY"
              echo "__ENV__"
              echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD<<__ENV__"
              echo "$IN_UPDATER_KEY_PASSWORD"
              echo "__ENV__"
            } >> "$GITHUB_ENV"
            echo "已注入自动更新签名密钥"
          fi

      - name: 检查自动更新配置并准备 v2 打包配置
        id: updater
        env:
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
        run: node scripts/release-lib.mjs prepare

      # PFX 链路只用于仍有效、允许导出的证书（例如内部信任签名）。
      # 公共代码签名按服务商硬件 / 托管方案配置 bundle.windows.signCommand，
      # 接入方式见 docs/build-release.md。
      - name: 导入 Windows 代码签名证书
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
        run: |
          if ($env:SIGNPATH_ORGANIZATION_ID -and $env:WINDOWS_CERTIFICATE) {
            throw "SignPath 与 WINDOWS_CERTIFICATE 只能配置一种 Windows 签名方式"
          }
          $configJson = node scripts/build-lib.mjs windows
          if ($LASTEXITCODE -ne 0) { throw "读取 Windows 生效配置失败" }
          $config = $configJson | ConvertFrom-Json
          if ($env:SIGNPATH_ORGANIZATION_ID -and $config.bundle.createUpdaterArtifacts) {
            throw "SignPath 会改变安装包字节；启用 updater 时必须在 Authenticode 签名后重新生成 .sig 和 latest.json，当前签名 job 尚未支持此组合"
          }
          if (-not $env:WINDOWS_CERTIFICATE) {
            Write-Host "未配置 WINDOWS_CERTIFICATE，Windows 产物不签名"
            exit 0
          }
          if (-not $env:WINDOWS_CERTIFICATE_PASSWORD) {
            throw "已配置 WINDOWS_CERTIFICATE 但缺少 WINDOWS_CERTIFICATE_PASSWORD"
          }
          $pfxPath = Join-Path $env:RUNNER_TEMP "codesign.pfx"
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $secure = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password $secure
          Remove-Item $pfxPath -Force
          "WINDOWS_CERT_THUMBPRINT=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "已导入证书：$($cert.Subject)"

      - name: 生成 Windows 签名配置
        if: matrix.platform == 'windows-latest' && env.WINDOWS_CERT_THUMBPRINT != ''
        shell: bash
        run: |
          set -euo pipefail
          printf '{\n  "bundle": {\n    "windows": {\n      "certificateThumbprint": "%s",\n      "digestAlgorithm": "sha256",\n      "timestampUrl": "http://timestamp.digicert.com"\n    }\n  }\n}\n' \
            "$WINDOWS_CERT_THUMBPRINT" > "$RUNNER_TEMP/tauri-signing.json"
          # RUNNER_TEMP 不含空格，不加引号，避免 action 解析参数时把引号算进路径
          echo "SIGNING_ARGS=--config $RUNNER_TEMP/tauri-signing.json" >> "$GITHUB_ENV"

      # 未配置签名时产物可用，但用户会看到"未知发布者"（Windows）或无法通过公证（macOS）。
      # 需要的 secrets 见 docs/build-release.md 的「代码签名」一节：
      #   WINDOWS_CERTIFICATE / WINDOWS_CERTIFICATE_PASSWORD（Windows PFX，base64）
      #   APPLE_CERTIFICATE / APPLE_CERTIFICATE_PASSWORD / APPLE_SIGNING_IDENTITY /
      #   APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID（macOS 公证）
      #   TAURI_SIGNING_PRIVATE_KEY / TAURI_SIGNING_PRIVATE_KEY_PASSWORD（自动更新签名）
      # 证书不能进仓库，只能放 secrets。
      - uses: tauri-apps/tauri-action@v1
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "v__VERSION__"
          releaseBody: |
            安装包与分发文件见下方 Assets。使用说明见仓库 README。

            [Code signing policy](https://github.com/${{ github.repository }}/blob/v__VERSION__/docs/code-signing-policy.md)：签名范围、服务状态与隐私说明。签名结果以下载文件的实际验证为准。
          releaseDraft: true
          prerelease: ${{ steps.version.outputs.prerelease }}
          # 各平台先验证自己的签名，最后由单一 job 汇总，避免矩阵并发覆盖 latest.json。
          uploadUpdaterJson: false
          uploadUpdaterSignatures: ${{ steps.updater.outputs.enabled == 'true' }}
          args: ${{ matrix.args }} ${{ env.SIGNING_ARGS }} ${{ steps.updater.outputs.args }}

      - name: 校验 Windows 签名
        if: matrix.platform == 'windows-latest' && env.WINDOWS_CERT_THUMBPRINT != ''
        shell: pwsh
        run: |
          $release = "src-tauri/target/release"
          $files = @(Get-ChildItem $release -Filter *.exe -File -ErrorAction Stop)
          if ($files.Count -eq 0) { throw "没有找到待验证的 Windows 产物" }
          $configJson = node scripts/build-lib.mjs windows
          if ($LASTEXITCODE -ne 0) { throw "读取 Windows 生效配置失败" }
          $config = $configJson | ConvertFrom-Json
          $targets = @($config.bundle.targets ?? "all")
          foreach ($target in @("nsis", "msi")) {
            if ($config.bundle.active -eq $false -or ($targets -notcontains "all" -and $targets -notcontains $target)) { continue }
            $extension = if ($target -eq "nsis") { "*.exe" } else { "*.msi" }
            $bundles = @(Get-ChildItem "$release/bundle/$target" -Filter $extension -File -ErrorAction Stop)
            if ($bundles.Count -eq 0) { throw "没有找到 $target 安装包" }
            $files += $bundles
          }
          foreach ($file in $files) {
            $sig = Get-AuthenticodeSignature $file.FullName
            if ($sig.Status -ne "Valid") {
              throw "签名无效：$($file.Name) -> $($sig.Status) $($sig.StatusMessage)"
            }
            Write-Host "签名有效：$($file.Name) <- $($sig.SignerCertificate.Subject)"
          }

      - name: 验证更新包签名、公钥与签名版本
        id: updater-metadata
        if: steps.updater.outputs.enabled == 'true'
        env:
          TAURI_ARTIFACT_PATHS: ${{ steps.tauri.outputs.artifactPaths }}
          ARTIFACT_TARGET: ${{ matrix.target }}
        run: node scripts/release-lib.mjs collect

      - name: 保存本次平台的已验证更新元数据
        if: steps.updater.outputs.enabled == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: updater-metadata-${{ matrix.target }}
          path: ${{ steps.updater-metadata.outputs.metadata-file }}
          if-no-files-found: error

      - name: 独立 Windows runner 验证安装器绘制
        if: matrix.platform == 'windows-latest' && contains(steps.tauri.outputs.artifactPaths, '-setup.exe')
        run: pnpm test:installer --interactive

      - name: 归档本次分发产物
        id: collect
        env:
          TAURI_ARTIFACT_PATHS: ${{ steps.tauri.outputs.artifactPaths }}
          ARTIFACT_TARGET: ${{ matrix.target }}
        run: node scripts/collect-artifacts.mjs

      - name: 保留 macOS 应用归档的文件权限
        if: matrix.platform == 'macos-latest'
        env:
          ARTIFACT_DIR: ${{ steps.collect.outputs.artifact-dir }}
        run: tar -czf "$ARTIFACT_DIR.tar.gz" -C "$ARTIFACT_DIR/.." installers

      - name: 保存按版本归档的安装包
        uses: actions/upload-artifact@v7
        with:
          name: build-installers-${{ matrix.target }}
          path: ${{ matrix.platform == 'macos-latest' && format('{0}.tar.gz', steps.collect.outputs.artifact-dir) || steps.collect.outputs.artifact-dir }}
          if-no-files-found: error

      # 直接保存本次 Windows 构建，签名 job 不从可变的 Release 资产重新取包。
      - name: 保存未签名 Windows 安装包
        if: matrix.platform == 'windows-latest' && vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-nsis
          path: ${{ steps.collect.outputs.artifact-dir }}/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  publish-updater:
    name: 汇总全部平台的自动更新清单
    needs: build
    if: needs.build.outputs.updater-enabled == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@v8
        with:
          pattern: updater-metadata-*
          path: updater-metadata
          merge-multiple: true
      - name: 校验四目标、已上传资产并生成 latest.json
        id: manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPDATER_METADATA_DIR: updater-metadata
        run: node scripts/release-lib.mjs merge
      - uses: actions/upload-artifact@v7
        with:
          name: updater-latest-json
          path: ${{ steps.manifest.outputs.manifest-file }}
          if-no-files-found: error

  # 可选：SignPath Foundation（开源免费签名）。未配置仓库变量时整个 job 跳过，
  # 不影响现有发布流程。申请与配置步骤见 docs/build-release.md 的「路线 A」。
  # 与上面的 PFX 链路二选一：同时配置会在构建前报错。
  # 仓库变量：SIGNPATH_ORGANIZATION_ID / SIGNPATH_PROJECT_SLUG /
  #            SIGNPATH_SIGNING_POLICY_SLUG / SIGNPATH_ARTIFACT_CONFIGURATION_SLUG
  # 仓库密钥：SIGNPATH_API_TOKEN
  sign-windows:
    name: 签名 Windows 安装包（未配置 SignPath 时跳过）
    needs: build
    if: vars.SIGNPATH_ORGANIZATION_ID != ''
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: 计算 tag 与版本号
        shell: pwsh
        run: |
          $ref = $env:GITHUB_REF
          if ($ref -like "refs/tags/*") {
            $tag = $ref -replace "^refs/tags/", ""
          } else {
            $tag = "v" + (node -p "require('./package.json').version")
          }
          "TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "VERSION=$($tag.TrimStart('v'))" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: 查找本次构建的未签名 artifact
        id: unsigned
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $response = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID/artifacts?per_page=100"
          if ($LASTEXITCODE -ne 0) { throw "读取 workflow artifacts 失败" }
          $artifacts = @(($response | ConvertFrom-Json).artifacts | Where-Object { $_.name -eq "unsigned-nsis" -and -not $_.expired })
          if ($artifacts.Count -ne 1) { throw "本次 run 必须恰好有一个 unsigned-nsis artifact" }
          "artifact-id=$($artifacts[0].id)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: 提交 SignPath 签名请求
        id: signpath
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          # 每次签名均需在 SignPath 门户批准，为人工处理保留等待时间
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed
          parameters: |
            version: "${{ env.VERSION }}"

      - name: 校验签名
        shell: pwsh
        run: |
          $files = Get-ChildItem signed -Filter *.exe -Recurse -ErrorAction Stop
          if (-not $files) { throw "SignPath 没有返回签名产物" }
          $configJson = node scripts/build-lib.mjs windows
          if ($LASTEXITCODE -ne 0) { throw "读取 Windows 生效配置失败" }
          $productName = ($configJson | ConvertFrom-Json).productName
          $expectedName = "${productName}_$($env:VERSION)_x64-setup.exe"
          if (@($files).Count -ne 1 -or $files[0].Name -ne $expectedName) {
            throw "SignPath 返回的文件与本次构建不匹配，应为 $expectedName"
          }
          foreach ($file in $files) {
            if ($file.VersionInfo.ProductVersion -ne $env:VERSION -or $file.VersionInfo.FileVersion -ne $env:VERSION) {
              throw "签名产物版本与本次 tag 不一致：$($file.Name)"
            }
            $sig = Get-AuthenticodeSignature $file.FullName
            if ($sig.Status -ne "Valid") {
              throw "签名无效：$($file.Name) -> $($sig.Status)"
            }
            if ($sig.SignerCertificate.Subject -notlike "*SignPath*") {
              throw "签名者不是 SignPath：$($sig.SignerCertificate.Subject)"
            }
            Write-Host "签名有效：$($file.Name) <- $($sig.SignerCertificate.Subject)"
          }

      - name: 归档签名后的安装包
        id: collect-signed
        shell: pwsh
        env:
          ARTIFACT_TARGET: x86_64-pc-windows-msvc
        run: |
          $files = @(Get-ChildItem signed -Filter *-setup.exe -Recurse -File | ForEach-Object { $_.FullName })
          $env:TAURI_ARTIFACT_PATHS = ConvertTo-Json -InputObject $files -Compress
          node scripts/collect-artifacts.mjs --signed-nsis

      - name: 保存签名后的安装包
        uses: actions/upload-artifact@v7
        with:
          name: signed-installers-x86_64-pc-windows-msvc
          path: ${{ steps.collect-signed.outputs.artifact-dir }}
          if-no-files-found: error

      - name: 用签名产物覆盖 draft Release 资产
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $releaseJson = gh release view $env:TAG --repo $env:GITHUB_REPOSITORY --json isDraft,tagName
          if ($LASTEXITCODE -ne 0) { throw "读取本次 Release 状态失败" }
          $release = $releaseJson | ConvertFrom-Json
          if (-not $release.isDraft -or $release.tagName -ne $env:TAG) {
            throw "签名产物只能替换本次版本的 draft Release 资产"
          }
          $uploadDir = Join-Path $env:RUNNER_TEMP "signed-release-assets"
          New-Item -ItemType Directory -Path $uploadDir -Force | Out-Null
          $uploads = @()
          foreach ($file in Get-ChildItem signed -Filter *.exe -Recurse -File) {
            # 与 tauri-action 的 ghAssetName 规则一致，保证覆盖同一个 Release 资产。
            $assetName = $file.Name.Trim() -replace '[^a-zA-Z0-9_-]', '.' -replace '\.\.', '.'
            $destination = Join-Path $uploadDir $assetName
            Copy-Item -LiteralPath $file.FullName -Destination $destination
            $uploads += $destination
          }
          gh release upload $env:TAG @uploads --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw "上传签名后的安装包失败" }
