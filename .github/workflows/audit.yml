name: Dependency Audit

# 每周一自动审计一次，紧跟 dependabot 的升级 PR（也是周一）。
# 有已知漏洞时任务变红；修复靠升级依赖，无法升级时按 security.md 记录原因与缓解措施。
on:
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:

jobs:
  pnpm-audit:
    name: npm 依赖审计
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # 只读锁文件，不需要安装依赖。发现漏洞时退出码非零
      - name: pnpm audit
        run: pnpm audit

  cargo-audit:
    name: Rust 依赖审计
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # 直接使用 cargo-audit 的退出码，发现漏洞时让 job 失败。
      # audit-check action 默认查仓库根目录，且报告 issue/check 需要额外写权限。
      - name: 安装 cargo-audit
        run: cargo install cargo-audit --locked

      - name: cargo audit
        run: cargo audit --file src-tauri/Cargo.lock
