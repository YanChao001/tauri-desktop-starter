<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>本地工作台</title>
    <style>
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.85em;
      }
      caption {
        text-align: left;
        padding: 10px;
        font-weight: 600;
      }
      th,
      td {
        padding: 9px 10px;
        border-bottom: 1px solid var(--border);
        text-align: left;
        max-width: 260px;
        overflow-wrap: anywhere;
      }
      .error {
        color: var(--destructive);
        font-size: 0.85em;
      }
      body {
        padding: 0;
      }
      .studio-app {
        --art-violet: #7760dd;
        --art-cyan: #219caf;
        --art-rose: #ce658f;
        --art-orange: #bc7838;
        --studio-line: color-mix(in oklab, var(--primary) 10%, var(--border));
        --studio-soft: color-mix(
          in oklab,
          var(--art-violet) 3%,
          var(--background)
        );
        --studio-radius: calc(var(--radius, 0.625rem) + 0.5rem);
        container: workbench-studio / inline-size;
        width: 100%;
        max-width: 1280px;
        min-width: 0;
        margin: 0 auto;
        padding: 24px;
        color: var(--foreground);
      }
      .dark .studio-app {
        --art-violet: #b0a0ff;
        --art-cyan: #62c8dc;
        --art-rose: #f3a0c2;
        --art-orange: #e8ad76;
      }
      .studio-app *,
      .studio-app *::before,
      .studio-app *::after {
        box-sizing: border-box;
      }
      .studio-app :is(h1, h2, h3, p) {
        margin: 0;
      }
      .studio-app :is(button, input, textarea, select):focus-visible {
        outline: 2px solid var(--ring);
        outline-offset: 3px;
      }
      .studio-app button {
        cursor: pointer;
      }
      .studio-app button:disabled {
        cursor: default;
      }
      .studio-app svg {
        flex-shrink: 0;
      }
      .studio-heading {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1.5rem;
        padding: 0.25rem 0 1.5rem;
      }
      .studio-heading h1 {
        font-size: clamp(1.65rem, 3.2cqi, 2rem);
        font-weight: 600;
        line-height: 1.3;
        letter-spacing: -0.05em;
      }
      .studio-heading p {
        max-width: 68ch;
        margin-top: 0.65rem;
        color: var(--muted-foreground);
        font-size: 0.875rem;
        line-height: 1.8;
      }
      .studio-emblem {
        position: relative;
        width: 4.5rem;
        height: 4.5rem;
        margin-right: 0.5rem;
        flex: 0 0 auto;
        transform: rotate(-20deg);
      }
      .studio-emblem i {
        position: absolute;
        inset: 1rem 0.15rem;
        border: 1px solid var(--art-violet);
        border-radius: 50%;
      }
      .studio-emblem i:nth-child(2) {
        border-color: var(--art-cyan);
        transform: rotate(60deg);
      }
      .studio-emblem i:nth-child(3) {
        border-color: var(--art-rose);
        transform: rotate(120deg);
      }
      .studio-emblem::after {
        content: "";
        position: absolute;
        width: 0.5rem;
        height: 0.5rem;
        top: 1.3rem;
        right: 0.6rem;
        border-radius: 50%;
        background: var(--art-cyan);
        box-shadow: 0 0 0 0.3rem
          color-mix(in oklab, var(--art-cyan) 10%, transparent);
      }
      .studio-nav {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 0.6rem;
        margin-bottom: 1.5rem;
      }
      .studio-nav > button {
        --nav-tone: var(--art-violet);
        position: relative;
        display: flex;
        justify-content: flex-start;
        align-items: center;
        min-width: 0;
        height: auto;
        min-height: 4.5rem;
        padding: 0.8rem 0.9rem;
        gap: 0.7rem;
        white-space: normal;
        text-align: left;
        color: var(--foreground);
        border: 1px solid var(--border);
        border-radius: var(--studio-radius);
        transition:
          border-color 160ms,
          background 160ms,
          box-shadow 160ms,
          transform 180ms;
      }
      .studio-nav > button:nth-child(2) {
        --nav-tone: var(--art-cyan);
      }
      .studio-nav > button:nth-child(3) {
        --nav-tone: var(--art-rose);
      }
      .studio-nav > button:hover {
        background: var(--surface-state-hover);
        border-color: color-mix(in oklab, var(--nav-tone) 45%, var(--border));
        transform: translateY(-2px);
      }
      .studio-nav > button[aria-selected="true"] {
        background: var(--surface-state-selected);
        border-color: color-mix(in oklab, var(--nav-tone) 60%, var(--border));
        box-shadow: inset 0 -2px 0
          color-mix(in oklab, var(--nav-tone) 60%, transparent);
      }
      .nav-icon {
        display: grid;
        place-items: center;
        flex: 0 0 auto;
        width: 2rem;
        height: 2rem;
        border: 1px solid
          color-mix(in oklab, var(--nav-tone) 20%, var(--border));
        background: var(--surface-state-selected);
        border-radius: calc(var(--radius, 0.625rem) + 0.125rem);
        color: var(--nav-tone);
      }
      .nav-icon svg {
        width: 1rem;
        height: 1rem;
      }
      .nav-copy {
        display: block;
        min-width: 0;
      }
      .nav-copy strong {
        display: block;
        font-size: 0.8125rem;
        line-height: 1.4;
        font-weight: 550;
      }
      .nav-copy small {
        display: block;
        margin-top: 0.25rem;
        color: var(--muted-foreground);
        font-size: 0.6875rem;
        line-height: 1.4;
      }
      .nav-index {
        margin-left: auto;
        align-self: flex-start;
        color: var(--muted-foreground);
        font:
          0.625rem/1.5 ui-monospace,
          monospace;
      }
      .studio-scene {
        min-width: 0;
      }
      .studio-scene[hidden] {
        display: none;
      }
      .studio-emblem b {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        font-size: 1.6rem;
        color: var(--art-violet);
      }
      .stage-coordinate {
        position: absolute;
        top: 1rem;
        left: 1rem;
        font-size: 0.65rem;
        letter-spacing: 0.12em;
        color: var(--muted-foreground);
      }
      .lens-chart {
        height: 250px;
        min-width: 0;
      }
      .lens-chart > svg {
        width: 100%;
        height: 100%;
      }
      .data-editor {
        padding: 1rem 1.25rem;
        border-top: 1px solid var(--border);
      }
      .data-editor .scene-actions {
        margin-top: 0.75rem;
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }
      .studio-app .app-header {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        align-items: center;
        justify-content: space-between;
      }
      .scene-heading {
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 1rem;
        padding: 1.25rem 1.5rem;
        margin-bottom: 0;
        border-bottom: 1px solid var(--studio-line);
      }
      .studio-heading #app-name {
        margin: 0;
      }
      .inspector #node-detail {
        min-height: 5rem;
        height: 5rem;
        max-height: 9rem;
        font-family: inherit;
      }
      .chart-toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 0.75rem;
      }
      #lens-source {
        min-height: 10rem;
        font-family: ui-monospace, monospace;
      }
      .eyebrow {
        display: flex;
        align-items: center;
        gap: 0.45rem;
        color: var(--art-violet);
        font-size: 0.625rem;
        line-height: 1.4;
        letter-spacing: 0.14em;
        font-weight: 550;
        text-transform: uppercase;
      }
      .eyebrow::before {
        content: "";
        width: 0.35rem;
        height: 0.35rem;
        background: currentColor;
        border-radius: 50%;
      }
      .scene-heading h2 {
        margin-top: 0.5rem;
        font-size: 1.2rem;
        letter-spacing: -0.035em;
        line-height: 1.4;
        font-weight: 600;
      }
      .scene-heading p {
        max-width: 65ch;
        margin-top: 0.45rem;
        font-size: 0.8125rem;
        line-height: 1.75;
        color: var(--muted-foreground);
      }
      .scene-actions {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.5rem;
      }
      .scene-actions button,
      .scene-footer button,
      .side-panel button,
      .inspector > button {
        min-height: 2rem;
      }
      .scene-actions button svg,
      .scene-footer button svg,
      .side-panel button svg {
        width: 0.875rem;
        height: 0.875rem;
      }
      .studio-console {
        border: 1px solid var(--studio-line);
        border-radius: calc(var(--studio-radius) + 0.25rem);
        overflow: clip;
        background: var(--surface-card, var(--card));
      }
      .canvas-grid,
      .lens-grid,
      .flow-grid {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 240px;
        min-width: 0;
      }
      .lens-grid,
      .flow-grid {
        grid-template-columns: minmax(0, 1fr) 260px;
      }
      .node-stage {
        position: relative;
        isolation: isolate;
        overflow: hidden;
        min-height: var(--canvas-height, 390px);
        min-width: 0;
        background-color: var(--studio-soft);
        background-image:
          linear-gradient(
            color-mix(in oklab, var(--art-violet) 6%, transparent) 1px,
            transparent 1px
          ),
          linear-gradient(
            90deg,
            color-mix(in oklab, var(--art-violet) 6%, transparent) 1px,
            transparent 1px
          );
        background-size: 28px 28px;
      }
      .node-stage::before,
      .chart-stage::before {
        content: "";
        position: absolute;
        inset: 1rem;
        border: 1px solid
          color-mix(in oklab, var(--art-violet) 11%, transparent);
        border-radius: calc(var(--radius, 0.625rem) * 0.75);
        pointer-events: none;
      }
      .stage-label {
        position: absolute;
        top: 1rem;
        left: 1rem;
        z-index: 1;
        color: var(--muted-foreground);
        font:
          0.625rem/1.5 ui-monospace,
          monospace;
        letter-spacing: 0.06em;
      }
      .stage-hint {
        position: absolute;
        bottom: 1.1rem;
        left: 1.25rem;
        right: 1.25rem;
        color: var(--muted-foreground);
        text-align: center;
        font-size: 0.6875rem;
        line-height: 1.6;
        pointer-events: none;
      }
      .node-links {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        overflow: visible;
        pointer-events: none;
      }
      .node-links path {
        fill: none;
        stroke: color-mix(in oklab, var(--art-violet) 34%, var(--border));
        stroke-width: 1.6;
        vector-effect: non-scaling-stroke;
      }
      .node-links .flow-pulse {
        stroke: var(--art-cyan);
        stroke-width: 2;
        stroke-dasharray: 10 20;
        animation: studio-link-flow 1.4s linear infinite;
        animation-play-state: paused;
        opacity: 0.8;
      }
      .node-links circle {
        fill: var(--card);
        stroke: var(--art-violet);
        stroke-width: 1.5;
      }
      .canvas-node {
        --node-tone: var(--art-violet);
        position: absolute;
        z-index: 2;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        justify-content: center;
        width: 21%;
        max-width: 190px;
        min-width: 0;
        height: 8rem;
        gap: 0.35rem;
        padding: 0.8rem;
        transform: translate(-50%, -50%);
        white-space: normal;
        text-align: left;
        color: var(--foreground);
        border: 1px solid
          color-mix(in oklab, var(--node-tone) 28%, var(--border));
        border-radius: calc(var(--radius, 0.625rem) + 0.25rem);
        box-shadow: 0 6px 16px -12px
          color-mix(in oklab, var(--foreground) 30%, transparent);
        transition:
          border-color 160ms,
          box-shadow 180ms,
          background 160ms;
      }
      .canvas-node[data-tone="cyan"] {
        --node-tone: var(--art-cyan);
      }
      .canvas-node[data-tone="rose"] {
        --node-tone: var(--art-rose);
      }
      .canvas-node[data-tone="orange"] {
        --node-tone: var(--art-orange);
      }
      .canvas-node:hover {
        background: var(--surface-state-hover);
        border-color: var(--node-tone);
        box-shadow: 0 8px 20px -10px
          color-mix(in oklab, var(--node-tone) 30%, transparent);
      }
      .canvas-node[aria-pressed="true"],
      .canvas-node[data-selected="true"] {
        border-color: var(--node-tone);
        box-shadow:
          0 0 0 3px color-mix(in oklab, var(--node-tone) 11%, transparent),
          0 8px 20px -12px
            color-mix(in oklab, var(--node-tone) 25%, transparent);
        background: var(--surface-state-selected);
      }
      .node-icon {
        flex-shrink: 0;
        display: grid;
        place-items: center;
        width: 1.6rem;
        height: 1.6rem;
        color: var(--node-tone);
        border-radius: calc(var(--radius, 0.625rem) * 0.65);
        background: var(--surface-state-selected);
      }
      .node-icon svg {
        width: 0.9rem;
        height: 0.9rem;
      }
      .node-title {
        display: -webkit-box;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
        flex-shrink: 0;
        width: 100%;
        overflow: hidden;
        text-overflow: ellipsis;
        font-size: 0.8125rem;
        font-weight: 550;
        line-height: 1.4;
      }
      .node-detail {
        display: -webkit-box;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
        width: 100%;
        overflow: hidden;
        text-overflow: ellipsis;
        color: var(--muted-foreground);
        font-size: 0.625rem;
        line-height: 1.4;
      }
      .node-port {
        position: absolute;
        top: 50%;
        right: -0.25rem;
        width: 0.5rem;
        height: 0.5rem;
        border: 1px solid var(--node-tone);
        border-radius: 50%;
        background: var(--card);
      }
      .inspector,
      .side-panel {
        min-width: 0;
        padding: 1.25rem;
        border-left: 1px solid var(--studio-line);
        background: var(--surface-card, var(--card));
      }
      .inspector h3,
      .side-panel h3 {
        font-size: 0.75rem;
        font-weight: 600;
        line-height: 1.5;
      }
      .inspector > p,
      .side-panel > p {
        margin-top: 0.5rem;
        color: var(--muted-foreground);
        font-size: 0.75rem;
        line-height: 1.8;
      }
      .control-field {
        display: block;
        min-width: 0;
        margin-top: 1.25rem;
      }
      .inspector .control-field {
        margin-top: 0.75rem;
      }
      .inspector > button {
        width: 100%;
        margin-top: 0.5rem;
      }
      .inspector .mini-stats {
        margin-top: 0;
      }
      .control-field > span,
      .control-field > label {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.5rem;
        margin-bottom: 0.5rem;
        color: var(--muted-foreground);
        font-size: 0.75rem;
        line-height: 1.5;
      }
      .control-field output {
        color: var(--foreground);
        font:
          0.75rem/1.5 ui-monospace,
          monospace;
      }
      .control-field :is(input, select) {
        font-size: 0.75rem;
      }
      .control-field input[type="range"] {
        height: 1.5rem;
        margin: 0;
      }
      .inspector-summary {
        margin-top: 1.25rem;
        padding-top: 1rem;
        border-top: 1px solid var(--border);
      }
      .inspector-summary > strong {
        display: block;
        font-size: 0.8125rem;
        font-weight: 550;
      }
      .inspector-summary p {
        margin-top: 0.5rem;
        color: var(--muted-foreground);
        font-size: 0.75rem;
        line-height: 1.8;
      }
      .mini-stats {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 0.65rem;
        margin-top: 1rem;
      }
      .stat {
        min-width: 0;
        padding: 0.65rem 0.75rem;
        border: 1px solid var(--border);
        border-radius: var(--radius, 0.625rem);
      }
      .stat strong {
        display: block;
        font-size: 1.1rem;
        line-height: 1.2;
        font-weight: 550;
        letter-spacing: -0.04em;
      }
      .stat span,
      .stat small {
        display: block;
        margin-top: 0.35rem;
        color: var(--muted-foreground);
        font-size: 0.625rem;
        line-height: 1.5;
      }
      .scene-footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 0.65rem 1rem;
        padding: 0.8rem 1.25rem;
        border-top: 1px solid var(--studio-line);
        background: var(--surface-card, var(--card));
      }
      .scene-footer > p,
      .scene-footer > span {
        margin: 0;
        color: var(--muted-foreground);
        font-size: 0.6875rem;
        line-height: 1.7;
      }
      .scene-footer > div {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 0.5rem;
      }
      .status-dot {
        display: inline-block;
        width: 0.35rem;
        height: 0.35rem;
        margin-right: 0.4rem;
        vertical-align: middle;
        border-radius: 50%;
        background: var(--art-cyan);
      }
      .chart-stage {
        position: relative;
        min-height: 330px;
        min-width: 0;
        padding: 1.25rem 1.5rem;
        background: var(--studio-soft);
      }
      .bar-chart {
        position: relative;
        display: flex;
        align-items: stretch;
        justify-content: space-around;
        gap: clamp(0.5rem, 1.8cqi, 1.25rem);
        height: 100%;
        padding: 1.3rem 0.25rem 1.9rem;
        background-image: repeating-linear-gradient(
          to top,
          color-mix(in oklab, var(--art-cyan) 11%, transparent) 0 1px,
          transparent 1px 25%
        );
        border-bottom: 1px solid var(--studio-line);
      }
      .bar-column {
        --bar-tone: var(--art-violet);
        position: relative;
        display: flex;
        flex: 1;
        align-items: flex-end;
        justify-content: center;
        min-width: 0;
        height: 100%;
        max-width: 4rem;
      }
      .bar-column:nth-child(3n + 2) {
        --bar-tone: var(--art-cyan);
      }
      .bar-column:nth-child(3n) {
        --bar-tone: var(--art-rose);
      }
      .bar-fill {
        position: relative;
        width: 100%;
        height: var(--bar-height, 50%);
        min-height: 2px;
        border: 1px solid color-mix(in oklab, var(--bar-tone) 55%, transparent);
        border-radius: 0.5rem 0.5rem 0.15rem 0.15rem;
        background: linear-gradient(
          180deg,
          color-mix(in oklab, var(--bar-tone) 70%, var(--card)),
          color-mix(in oklab, var(--bar-tone) 20%, var(--card))
        );
        transition:
          height 380ms cubic-bezier(0.22, 1, 0.36, 1),
          filter 160ms;
      }
      .bar-column:hover .bar-fill {
        filter: brightness(1.08);
      }
      .bar-value {
        position: absolute;
        left: 50%;
        top: -0.3rem;
        transform: translate(-50%, -100%);
        color: var(--foreground);
        font:
          0.6875rem/1.5 ui-monospace,
          monospace;
        white-space: nowrap;
      }
      .bar-label {
        position: absolute;
        left: 50%;
        top: calc(100% + 0.55rem);
        transform: translateX(-50%);
        max-width: 100%;
        overflow: hidden;
        text-overflow: ellipsis;
        color: var(--muted-foreground);
        font-size: 0.625rem;
        white-space: nowrap;
      }
      .chart-stage > svg,
      .chart-stage > canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      .data-summary {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 0.75rem;
        padding: 1rem 1.25rem;
        border-top: 1px solid var(--studio-line);
      }
      .data-summary .stat {
        border: 0;
        border-radius: 0;
        padding: 0.15rem 0.75rem 0.15rem 0;
      }
      .data-summary .stat + .stat {
        border-left: 1px solid var(--border);
        padding-left: 1rem;
      }
      .data-summary .stat strong {
        font-size: 1.35rem;
      }
      .data-table-wrapper {
        max-height: 240px;
        overflow: auto;
        border-top: 1px solid var(--studio-line);
      }
      .data-table-wrapper:focus-visible {
        outline: 2px solid var(--ring);
        outline-offset: -2px;
      }
      .data-table-wrapper table {
        width: 100%;
        font-size: 0.75rem;
        border-collapse: collapse;
      }
      .data-table-wrapper :is(th, td) {
        padding: 0.7rem 1rem;
        text-align: left;
        border-bottom: 1px solid var(--border);
      }
      .data-table-wrapper th {
        position: sticky;
        top: 0;
        z-index: 1;
        font-size: 0.6875rem;
        font-weight: 500;
        color: var(--muted-foreground);
      }
      .data-table-wrapper tbody tr:last-child td {
        border-bottom: 0;
      }
      .data-table-wrapper tbody tr:hover {
        background: var(--surface-state-hover);
      }
      .data-table-wrapper td {
        font-variant-numeric: tabular-nums;
      }
      .pipeline-stage {
        display: grid;
        align-content: center;
        gap: 0;
        min-width: 0;
        min-height: 390px;
        padding: 2rem clamp(1rem, 4cqi, 3rem);
        background: var(--studio-soft);
      }
      .pipeline-node {
        --step-tone: var(--art-violet);
        position: relative;
        display: flex;
        align-items: center;
        gap: 0.85rem;
        min-width: 0;
        min-height: 4.3rem;
        padding: 0.8rem 1rem;
        border: 1px solid var(--studio-line);
        border-radius: calc(var(--radius, 0.625rem) + 0.25rem);
        transition:
          border-color 180ms,
          background 180ms,
          box-shadow 180ms;
      }
      .pipeline-node[data-state="done"] {
        --step-tone: var(--art-cyan);
        border-color: color-mix(in oklab, var(--art-cyan) 35%, var(--border));
      }
      .pipeline-node[data-state="running"] {
        border-color: var(--art-violet);
        background: var(--surface-state-selected);
        box-shadow: 0 0 0 3px
          color-mix(in oklab, var(--art-violet) 8%, transparent);
      }
      .step-number {
        display: grid;
        place-items: center;
        flex: 0 0 auto;
        width: 2rem;
        height: 2rem;
        border: 1px solid
          color-mix(in oklab, var(--step-tone) 24%, var(--border));
        border-radius: 50%;
        color: var(--foreground);
        background: var(--surface-state-selected);
        font:
          0.75rem/1 ui-monospace,
          monospace;
      }
      .step-copy {
        flex: 1;
        min-width: 0;
      }
      .step-copy strong {
        display: block;
        font-size: 0.8125rem;
        line-height: 1.5;
        font-weight: 550;
      }
      .step-copy p,
      .step-copy small {
        display: block;
        margin-top: 0.25rem;
        color: var(--muted-foreground);
        font-size: 0.6875rem;
        line-height: 1.6;
      }
      .step-state {
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        gap: 0.35rem;
        color: var(--muted-foreground);
        font-size: 0.625rem;
        white-space: nowrap;
      }
      .pipeline-node[data-state="running"] .step-state {
        color: var(--foreground);
      }
      .pipeline-node[data-state="done"] .step-state {
        color: var(--foreground);
      }
      .step-state svg {
        width: 0.85rem;
        height: 0.85rem;
      }
      .pipeline-connector {
        position: relative;
        width: 1px;
        height: 1.25rem;
        margin-left: 2rem;
        background: color-mix(in oklab, var(--art-violet) 30%, var(--border));
      }
      .pipeline-connector::after {
        content: "";
        position: absolute;
        left: -2px;
        bottom: 2px;
        width: 5px;
        height: 5px;
        border-right: 1px solid var(--art-violet);
        border-bottom: 1px solid var(--art-violet);
        transform: rotate(45deg);
      }
      .flow-results {
        margin-top: 1rem;
        padding: 1rem;
        border: 1px solid var(--studio-line);
        border-radius: var(--radius, 0.625rem);
        background: var(--surface-card, var(--card));
      }
      .flow-results strong {
        display: block;
        font-size: 0.8125rem;
        font-weight: 550;
      }
      .flow-results p {
        margin-top: 0.4rem;
        color: var(--muted-foreground);
        font-size: 0.75rem;
        line-height: 1.8;
      }
      .flow-results pre {
        max-height: 8rem;
        overflow: auto;
        margin: 0.75rem 0 0;
        color: var(--muted-foreground);
        font:
          0.6875rem/1.7 ui-monospace,
          monospace;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .orbit-dot {
        animation: studio-orbit 8s linear infinite;
        animation-play-state: paused;
        transform-origin: center;
      }
      html[data-playing="true"] .flow-pulse,
      .studio-app[data-playing="true"] .flow-pulse,
      html[data-playing="true"] .orbit-dot,
      .studio-app[data-playing="true"] .orbit-dot {
        animation-play-state: running;
      }
      .studio-app [hidden] {
        display: none;
      }
      @keyframes studio-scene-in {
        from {
          opacity: 0;
          transform: translateY(5px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes studio-link-flow {
        to {
          stroke-dashoffset: -30;
        }
      }
      @keyframes studio-orbit {
        to {
          transform: rotate(360deg);
        }
      }
      @container workbench-studio (max-width: 980px) {
        .studio-nav > button {
          height: 4rem;
        }
      }
      @container workbench-studio (max-width: 780px) {
        .canvas-grid,
        .lens-grid,
        .flow-grid {
          grid-template-columns: minmax(0, 1fr);
        }
        .inspector,
        .side-panel {
          border-left: 0;
          border-top: 1px solid var(--studio-line);
        }
        .inspector {
          display: grid;
          grid-template-columns: repeat(2, minmax(0, 1fr));
          gap: 1rem;
          align-items: start;
        }
        .inspector > h3,
        .inspector > p {
          grid-column: 1/-1;
        }
        .inspector > p {
          margin-top: -0.65rem;
        }
        .inspector .control-field,
        .inspector .mini-stats {
          margin-top: 0;
        }
        .inspector .inspector-summary {
          grid-column: 1/-1;
          margin-top: 0;
          padding-top: 0.8rem;
        }
        .side-panel .control-field {
          margin-top: 1rem;
        }
      }
      @container workbench-studio (max-width: 580px) {
        .studio-heading {
          gap: 0.75rem;
        }
        .studio-heading h1 {
          font-size: 1.65rem;
        }
        .studio-heading p {
          font-size: 0.8125rem;
        }
        .studio-emblem {
          width: 3.5rem;
          height: 3.5rem;
        }
        .studio-nav {
          gap: 0.5rem;
          margin-bottom: 1.25rem;
        }
        .studio-nav > button {
          height: auto;
          min-height: 3.8rem;
          gap: 0.6rem;
          padding: 0.65rem 0.75rem;
        }
        .nav-index {
          display: none;
        }
        .nav-copy strong {
          font-size: 0.75rem;
        }
        .nav-copy small {
          font-size: 0.625rem;
        }
        .scene-heading {
          gap: 0.85rem;
        }
        .scene-actions {
          width: 100%;
        }
        .scene-actions button {
          flex: 1;
        }
        .node-stage {
          min-height: var(--canvas-height, 320px);
          background-size: 24px 24px;
        }
        .canvas-node {
          width: 22%;
          height: 8.5rem;
          padding: 0.6rem;
          gap: 0.35rem;
        }
        .node-title {
          font-size: 0.75rem;
        }
        .node-detail {
          font-size: 0.5625rem;
        }
        .node-icon {
          width: 1.4rem;
          height: 1.4rem;
        }
        .scene-footer {
          padding: 0.8rem 1rem;
        }
        .inspector,
        .side-panel {
          padding: 1rem;
        }
        .chart-stage {
          padding-inline: 1.25rem;
          min-height: 300px;
        }
        .bar-value,
        .bar-label {
          font-size: 0.5625rem;
        }
        .data-summary {
          padding: 0.85rem 1rem;
          gap: 0.5rem;
        }
        .data-summary .stat strong {
          font-size: 1.15rem;
        }
        .data-summary .stat + .stat {
          padding-left: 0.65rem;
        }
        .pipeline-stage {
          min-height: 360px;
          padding: 1.5rem 1rem;
        }
        .pipeline-node {
          gap: 0.65rem;
          padding: 0.75rem;
        }
        .step-state {
          font-size: 0.5625rem;
        }
        .pipeline-connector {
          margin-left: 1.75rem;
        }
      }
      @media (max-width: 440px) {
        .studio-app {
          padding: 16px;
        }
        .studio-emblem {
          display: none;
        }
      }
      html[data-motion="reduced"] .studio-app *,
      .studio-app[data-motion="reduced"] * {
        animation: none;
        transition: none;
        scroll-behavior: auto;
      }
      html[data-motion="reduced"] .studio-nav > button:hover,
      .studio-app[data-motion="reduced"] .studio-nav > button:hover {
        transform: none;
      }
      @container workbench-studio (max-width: 380px) {
        .studio-nav > button {
          min-height: 3rem;
          padding: 0.6rem;
        }
        .studio-nav .nav-icon,
        .studio-nav .nav-copy small {
          display: none;
        }
        .studio-nav .nav-copy strong {
          font-size: 0.75rem;
          white-space: nowrap;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .studio-app *,
        .studio-app *::before,
        .studio-app *::after {
          animation: none;
          transition: none;
          scroll-behavior: auto;
        }
        .studio-nav > button:hover {
          transform: none;
        }
      }
      @media (prefers-contrast: more), (forced-colors: active) {
        .studio-emblem,
        .node-stage::before,
        .chart-stage::before {
          display: none;
        }
        .node-stage,
        .chart-stage,
        .pipeline-stage,
        .studio-nav > button,
        .canvas-node,
        .pipeline-node,
        .bar-fill {
          background: var(--card, Canvas);
        }
        .studio-nav > button[aria-selected="true"],
        .canvas-node[aria-pressed="true"] {
          outline: 2px solid var(--foreground, CanvasText);
          outline-offset: -3px;
        }
      }
    </style>
  </head>
  <body>
    <main class="studio-app" data-playing="false">
      <header class="studio-heading">
        <div>
          <h1 id="app-name">本地工作台</h1>
          <p
            data-zh="让灵感连成画布，让数据流向结果。"
            data-en="Connect ideas. Explore data. Build something that works."
          ></p>
        </div>
        <div class="studio-emblem" aria-hidden="true">
          <i></i><i></i><i></i><b>✳</b>
        </div>
      </header>
      <nav
        class="studio-nav"
        role="tablist"
        aria-label="工作空间"
        id="studio-nav"
      >
        <button
          data-surface="control"
          type="button"
          role="tab"
          id="studio-tab-canvas"
          aria-controls="scene-canvas"
          aria-selected="true"
          data-scene="canvas"
        >
          <span class="nav-icon" aria-hidden="true">◇</span
          ><span class="nav-copy"
            ><strong data-zh="创意画布" data-en="Canvas"></strong
            ><small data-zh="连接想法" data-en="Connect ideas"></small></span
          ><span class="nav-index">01</span>
        </button>
        <button
          data-surface="control"
          type="button"
          role="tab"
          id="studio-tab-lens"
          aria-controls="scene-lens"
          aria-selected="false"
          tabindex="-1"
          data-scene="lens"
        >
          <span class="nav-icon" aria-hidden="true">▥</span
          ><span class="nav-copy"
            ><strong data-zh="数据透镜" data-en="Data lens"></strong
            ><small data-zh="发现规律" data-en="Find patterns"></small></span
          ><span class="nav-index">02</span>
        </button>
        <button
          data-surface="control"
          type="button"
          role="tab"
          id="studio-tab-flow"
          aria-controls="scene-flow"
          aria-selected="false"
          tabindex="-1"
          data-scene="flow"
        >
          <span class="nav-icon" aria-hidden="true">⌘</span
          ><span class="nav-copy"
            ><strong data-zh="流程编排" data-en="Pipeline"></strong
            ><small
              data-zh="把数据变成结果"
              data-en="Shape the result"
            ></small></span
          ><span class="nav-index">03</span>
        </button>
      </nav>
      <section
        class="studio-scene"
        id="scene-canvas"
        role="tabpanel"
        aria-labelledby="studio-tab-canvas"
      >
        <div class="studio-console">
          <div class="scene-heading">
            <div>
              <span
                class="eyebrow"
                data-zh="你的想法，有了空间"
                data-en="A little room for big ideas"
              ></span>
              <h2
                data-zh="从一个节点，展开一个想法"
                data-en="One node. A world of possibilities."
              ></h2>
              <p
                data-zh="拖动、连接、编辑，把零散灵感组织成一张可导出的关系图。"
                data-en="Drag, connect and edit your ideas into a map you can export."
              ></p>
            </div>
            <div class="scene-actions">
              <button
                type="button"
                id="canvas-arrange"
                data-variant="outline"
                data-zh="自动排列"
                data-en="Arrange"
              ></button
              ><button
                type="button"
                id="canvas-add"
                data-zh="＋ 添加节点"
                data-en="＋ Add node"
              ></button>
            </div>
          </div>
          <div class="canvas-grid">
            <div
              data-surface="artwork"
              class="node-stage"
              id="node-stage"
              role="group"
              aria-label="创意画布"
            >
              <svg
                class="node-links"
                id="node-links"
                viewBox="0 0 900 440"
                preserveAspectRatio="none"
                aria-hidden="true"
              ></svg>
              <div class="stage-coordinate" aria-hidden="true">CANVAS / 01</div>
              <div
                class="stage-hint"
                data-zh="拖动节点 · 方向键微调 · 选择两点连线"
                data-en="Drag nodes · Arrow keys to move · Connect two nodes"
              ></div>
            </div>
            <aside class="inspector">
              <span
                class="eyebrow"
                data-zh="节点属性"
                data-en="Inspector"
              ></span
              ><label class="control-field"
                ><span data-zh="标题" data-en="Title"></span
                ><input id="node-title" maxlength="60" /></label
              ><label class="control-field"
                ><span data-zh="备注" data-en="Note"></span
                ><textarea
                  id="node-detail"
                  rows="3"
                  maxlength="240"
                ></textarea></label
              ><label class="control-field"
                ><span data-zh="连接到" data-en="Connect to"></span
                ><select id="node-target"></select></label
              ><button
                type="button"
                id="canvas-connect"
                data-variant="outline"
                data-zh="连接 / 断开"
                data-en="Toggle connection"
              ></button
              ><button
                type="button"
                id="canvas-remove"
                data-variant="ghost"
                data-zh="移除当前节点"
                data-en="Remove node"
              ></button>
              <div class="inspector-summary">
                <div class="mini-stats">
                  <div class="stat" data-surface="control">
                    <strong id="node-count">0</strong
                    ><span data-zh="节点" data-en="nodes"></span>
                  </div>
                  <div class="stat" data-surface="control">
                    <strong id="edge-count">0</strong
                    ><span data-zh="连接" data-en="links"></span>
                  </div>
                </div>
              </div>
            </aside>
          </div>
          <div class="scene-footer">
            <span class="status-label"
              ><i></i
              ><span
                data-zh="会话内画布 · 导出以保留成果"
                data-en="Session canvas · Export to keep your work"
              ></span
            ></span>
            <div class="scene-actions">
              <button
                type="button"
                id="motion-toggle"
                data-variant="ghost"
                data-zh="暂停动效"
                data-en="Pause motion"
              ></button
              ><button
                type="button"
                id="canvas-export"
                data-variant="outline"
                data-zh="导出画布"
                data-en="Export canvas"
              ></button>
            </div>
          </div>
        </div>
      </section>
      <section
        class="studio-scene"
        id="scene-lens"
        role="tabpanel"
        aria-labelledby="studio-tab-lens"
        hidden
      >
        <div class="studio-console">
          <div class="scene-heading">
            <div>
              <span
                class="eyebrow"
                data-zh="让数字说话"
                data-en="Give the numbers a voice"
              ></span>
              <h2
                data-zh="换一个角度，看见数据"
                data-en="A fresh perspective on your data"
              ></h2>
              <p
                data-zh="筛选、切换图形或编辑数据，图表和统计即时联动。初始内容为内置示例。"
                data-en="Filter, switch charts or edit rows. Charts and statistics update together. Starts with a built-in sample."
              ></p>
            </div>
            <div class="scene-actions">
              <button
                type="button"
                id="lens-export"
                data-variant="outline"
                data-zh="导出 CSV"
                data-en="Export CSV"
              ></button
              ><button
                type="button"
                id="lens-send"
                data-zh="送入流程 ↗"
                data-en="Send to pipeline ↗"
              ></button>
            </div>
          </div>
          <div class="data-summary">
            <div class="stat" data-surface="transparent">
              <span data-zh="当前记录" data-en="Visible rows"></span
              ><strong id="lens-count">0</strong>
            </div>
            <div class="stat" data-surface="transparent">
              <span data-zh="数值总和" data-en="Total value"></span
              ><strong id="lens-total">0</strong>
            </div>
            <div class="stat" data-surface="transparent">
              <span data-zh="平均值" data-en="Average"></span
              ><strong id="lens-average">0</strong>
            </div>
          </div>
          <div class="lens-grid">
            <div data-surface="artwork" class="chart-stage">
              <div class="chart-toolbar">
                <strong
                  data-zh="数值分布"
                  data-en="Value distribution"
                ></strong>
                <div class="scene-actions">
                  <button
                    type="button"
                    id="chart-bars"
                    aria-pressed="true"
                    data-variant="secondary"
                    data-zh="柱状"
                    data-en="Bars"
                  ></button
                  ><button
                    type="button"
                    id="chart-line"
                    aria-pressed="false"
                    data-variant="ghost"
                    data-zh="折线"
                    data-en="Line"
                  ></button>
                </div>
              </div>
              <div
                id="lens-chart"
                class="lens-chart"
                role="img"
                aria-label="数据分布"
              ></div>
              <p
                id="lens-empty"
                hidden
                data-zh="当前筛选没有记录，请调整分类或最低值。"
                data-en="No rows match. Try another category or a lower minimum."
              ></p>
            </div>
            <aside class="side-panel">
              <span class="eyebrow" data-zh="探索参数" data-en="Explore"></span
              ><label class="control-field"
                ><span data-zh="分类" data-en="Category"></span
                ><select id="lens-category"></select></label
              ><label class="control-field"
                ><span
                  ><span data-zh="最低值" data-en="Minimum"></span>
                  <output id="lens-min-value">0</output></span
                ><input
                  id="lens-min"
                  type="range"
                  min="0"
                  max="100"
                  value="0"
                  step="1" /></label
              ><button
                type="button"
                id="lens-edit"
                aria-controls="data-editor"
                aria-expanded="false"
                data-variant="outline"
                data-zh="编辑数据源"
                data-en="Edit source"
              ></button
              ><button
                type="button"
                id="lens-sample"
                data-variant="ghost"
                data-zh="恢复内置示例"
                data-en="Use built-in sample"
              ></button>
              <p
                class="panel-note"
                data-zh="支持 JSON 对象数组：label、category、value，最多 120 条。"
                data-en="JSON rows with label, category and value. Up to 120 rows."
              ></p>
            </aside>
          </div>
          <div class="data-editor" id="data-editor" hidden>
            <label class="control-field"
              ><span data-zh="数据源 · JSON" data-en="Source · JSON"></span
              ><textarea
                id="lens-source"
                aria-describedby="lens-error"
                rows="6"
                maxlength="48000"
                spellcheck="false"
              ></textarea>
            </label>
            <div class="scene-actions">
              <button
                type="button"
                id="lens-apply"
                data-zh="应用数据"
                data-en="Apply data"
              ></button
              ><button
                type="button"
                id="lens-cancel"
                data-variant="ghost"
                data-zh="放弃编辑"
                data-en="Discard edits"
              ></button>
            </div>
            <p id="lens-error" class="error" role="alert"></p>
          </div>
          <div
            class="data-table-wrapper"
            id="lens-table"
            tabindex="0"
            role="region"
            aria-label="数据透镜数据表"
          ></div>
          <div class="scene-footer">
            <span
              class="status-label"
              data-zh="所有图表均来自当前数据"
              data-en="Every chart is calculated from the current rows"
            ></span
            ><span id="lens-source-label" class="muted"></span>
          </div>
        </div>
      </section>
      <section
        class="studio-scene"
        id="scene-flow"
        role="tabpanel"
        aria-labelledby="studio-tab-flow"
        hidden
      >
        <div class="studio-console">
          <div class="scene-heading">
            <div>
              <span
                class="eyebrow"
                data-zh="把操作串起来"
                data-en="Turn a sequence into a system"
              ></span>
              <h2
                data-zh="一条流程，走向清晰的结果"
                data-en="A pipeline with a useful destination"
              ></h2>
              <p
                data-zh="为当前数据配置过滤、分组与排序；运行后查看每一步的真实输入输出。"
                data-en="Filter, group and sort your rows. Run to inspect the actual input and output of every step."
              ></p>
            </div>
            <div class="scene-actions">
              <button
                type="button"
                id="flow-export"
                data-variant="outline"
                disabled
                data-zh="导出结果"
                data-en="Export result"
              ></button
              ><button
                type="button"
                id="flow-run"
                data-zh="▶ 运行流程"
                data-en="▶ Run pipeline"
              ></button>
            </div>
          </div>
          <div class="flow-grid">
            <div
              data-surface="artwork"
              class="pipeline-stage"
              id="pipeline-stage"
            >
              <div class="pipeline-node" data-surface="control" data-step="0">
                <span class="step-number">01</span>
                <div class="step-copy">
                  <strong data-zh="读取数据" data-en="Read source"></strong>
                  <p
                    data-zh="来自数据透镜的当前数据"
                    data-en="Current rows from Data lens"
                  ></p>
                </div>

      <p id="studio-error" class="error" role="alert"></p>
      <p

    </main>
    <script>
      (() => {
        const $ = (id) => document.getElementById(id),
          create = (tag, text) => {
            const node = document.createElement(tag);
            if (text !== undefined) node.textContent = text;
            return node;
          };
        let current,
          working = false,
          panelVisible = true;
        const reducedMotion = window.matchMedia?.(
          "(prefers-reduced-motion: reduce)",
        );
        function stopMotion() {
          canvasAnimations.forEach((animation) => animation.cancel());
          canvasAnimations.clear();
        }
        function motionAllowed() {
          return (
            current?.active !== false &&
            (current?.theme?.motion ??
              document.documentElement.dataset.motion) !== "reduced" &&
            !reducedMotion?.matches &&
            !document.hidden &&
            panelVisible
          );
        }
        function syncMotion() {
          document.querySelector("main").dataset.motion = motionAllowed()
            ? "full"
            : "reduced";
          document.querySelector("main").dataset.playing = String(
            motionAllowed() && !studio.paused,
          );
          if (!motionAllowed() || studio.paused) {
            stopMotion();
            studioAnimation?.cancel();
            if (current?.active === false || document.hidden || !panelVisible)
              cancelFlow();
            else if (flowStep >= 0) {
              if (flowTimer !== null) clearTimeout(flowTimer);
              advanceFlow(flowGeneration);
            }
          }
        }
        const tr = (zh, en) => (current?.locale === "en" ? en : zh);
        function retain(dirty = true) {
          studioDirty ||= dirty;
          return starter.checkpoint({ studio }, dirty || studioDirty);
        }
        function render() {
          if (!current?.view) return;
          syncMotion();
          document
            .querySelector("main")
            .setAttribute("aria-busy", String(working || current.busy));
          $("app-name").textContent = tr("本地工作台", "Local workspace");
          document.title = tr("本地工作台", "Local workspace");
          studioControls();
        }
        const SCENES = ["canvas", "lens", "flow"];
        const svgNode = (tag, attributes = {}) => {
          const node = document.createElementNS(
            "http://www.w3.org/2000/svg",
            tag,
          );
          Object.entries(attributes).forEach(([key, value]) =>
            node.setAttribute(key, String(value)),
          );
          return node;
        };
        const sampleRows = () =>
          [
            ["Mon", "Design", 48],
            ["Tue", "Build", 72],
            ["Wed", "Design", 56],
            ["Thu", "Research", 34],
            ["Fri", "Build", 91],
            ["Sat", "Research", 63],
            ["Sun", "Design", 78],
            ["Next", "Build", 84],
          ].map(([label, category, value]) => ({ label, category, value }));
        function freshStudio() {
          return {
            schema: 1,
            sourceDraft: null,
            editorOpen: false,
            flowUseLens: false,
            flowCategory: "",
            flowLensMinimum: 0,
            scene: "canvas",
            paused: false,
            selected: "n2",
            chart: "bars",
            category: "",
            minimum: 0,
            flowMinimum: 30,
            aggregation: "sum",
            source: "sample",
            rows: sampleRows(),
            nodes: [
              {
                id: "n1",
                title: tr("捕捉灵感", "Capture an idea"),
                detail: tr(
                  "从一个值得探索的问题开始",
                  "Start with a question worth exploring",
                ),
                tone: "violet",
                x: 17,
                y: 26,
              },
              {
                id: "n2",
                title: tr("连接线索", "Connect the dots"),
                detail: tr(
                  "把想法组织成清晰的关系",
                  "Give your ideas a clear structure",
                ),
                tone: "cyan",
                x: 50,
                y: 26,
              },
              {
                id: "n3",
                title: tr("做出原型", "Make a prototype"),
                detail: tr(
                  "把抽象想法变成可以操作的东西",
                  "Turn the idea into something you can try",
                ),
                tone: "rose",
                x: 83,
                y: 26,
              },
              {
                id: "n4",
                title: tr("观察数据", "Explore the data"),
                detail: tr(
                  "在数据透镜里寻找下一步",
                  "Find the next step in Data lens",
                ),
                tone: "orange",
                x: 33,
                y: 72,
              },
              {
                id: "n5",
                title: tr("整理与交付", "Shape & deliver"),
                detail: tr(
                  "连接流程，导出属于你的成果",
                  "Build the flow and export your work",
                ),
                tone: "violet",
                x: 70,
                y: 72,
              },
            ],
            edges: [
              ["n1", "n2"],
              ["n2", "n3"],
              ["n2", "n4"],
              ["n3", "n5"],
              ["n4", "n5"],
            ],
          };
        }
        let studio = freshStudio(),
          studioLoaded = false,
          studioDirty = false,
          studioInvalid = false,
          studioLocale = null,
          studioAnimation = null,
          flowResult = null,
          flowTimer = null,
          flowStep = -1,
          flowSource = null,
          flowGeneration = 0,
          drag = null;
        const canvasHistory = [],
          canvasAnimations = new Set(),
          dataHistory = [];
        function parseRows(value) {
          if (!Array.isArray(value) || value.length > 120)
            throw new Error("rows");
          return value.map((row) => {
            if (
              !row ||
              typeof row !== "object" ||
              typeof row.label !== "string" ||
              !row.label.trim() ||
              row.label.length > 80 ||
              typeof row.category !== "string" ||
              !row.category.trim() ||
              row.category.length > 80 ||
              typeof row.value !== "number" ||
              !Number.isFinite(row.value) ||
              Math.abs(row.value) > 1000000 ||
              row.label.includes("\0") ||
              row.category.includes("\0")
            )
              throw new Error("row");
            return {
              label: row.label,
              category: row.category,
              value: row.value,
            };
          });
        }
        function restoreStudio(saved) {
          if (
            !saved ||
            saved.schema !== 1 ||
            !SCENES.includes(saved.scene) ||
            !Array.isArray(saved.nodes) ||
            saved.nodes.length < 1 ||
            saved.nodes.length > 24
          )
            return false;
          try {
            const nodes = saved.nodes.map((node) => {
              if (
                !node ||
                !/^n[0-9]{1,12}$/.test(node.id) ||
                typeof node.title !== "string" ||
                node.title.length > 60 ||
                typeof node.detail !== "string" ||
                node.detail.length > 240 ||
                !["violet", "cyan", "rose", "orange"].includes(node.tone) ||
                !Number.isFinite(node.x) ||
                !Number.isFinite(node.y) ||
                node.x < 12 ||
                node.x > 88 ||
                node.y < 16 ||
                node.y > 84
              )
                throw new Error("node");
              return {
                id: node.id,
                title: node.title,
                detail: node.detail,
                tone: node.tone,
                x: node.x,
                y: node.y,
              };
            });
            const ids = new Set(nodes.map((node) => node.id));
            if (
              ids.size !== nodes.length ||
              !Array.isArray(saved.edges) ||
              saved.edges.length > 64 ||
              saved.edges.some(
                (edge) =>
                  !Array.isArray(edge) ||
                  edge.length !== 2 ||
                  edge[0] === edge[1] ||
                  edge.some((id) => !ids.has(id)),
              )
            )
              return false;
            const rows = parseRows(saved.rows);
            if (
              (saved.sourceDraft !== undefined &&
                saved.sourceDraft !== null &&
                (typeof saved.sourceDraft !== "string" ||
                  new TextEncoder().encode(saved.sourceDraft).length >
                    48000)) ||
              (saved.editorOpen !== undefined &&
                typeof saved.editorOpen !== "boolean")
            )
              return false;
            studio = {
              ...freshStudio(),
              nodes,
              edges: saved.edges.map((edge) => [...edge]),
              rows,
              scene: saved.scene,
              selected: ids.has(saved.selected) ? saved.selected : nodes[0].id,
              paused: saved.paused === true,
              chart: saved.chart === "line" ? "line" : "bars",
              category:
                typeof saved.category === "string"
                  ? saved.category.slice(0, 80)
                  : "",
              minimum: Number.isFinite(saved.minimum)
                ? Math.max(-1000000, Math.min(1000000, saved.minimum))
                : 0,
              flowMinimum: Number.isFinite(saved.flowMinimum)
                ? Math.max(-1000000, Math.min(1000000, saved.flowMinimum))
                : 30,
              aggregation: ["sum", "average", "none"].includes(
                saved.aggregation,
              )
                ? saved.aggregation
                : "sum",
              source: saved.source === "sample" ? "sample" : "custom",
              sourceDraft: saved.sourceDraft ?? null,
              editorOpen: saved.editorOpen === true,
              flowUseLens: saved.flowUseLens === true,
              flowCategory:
                typeof saved.flowCategory === "string"
                  ? saved.flowCategory.slice(0, 80)
                  : "",
              flowLensMinimum: Number.isFinite(saved.flowLensMinimum)
                ? Math.max(-1000000, Math.min(1000000, saved.flowLensMinimum))
                : 0,
            };
            return true;
          } catch {
            return false;
          }
        }
        function announce(text) {
          $("studio-announcement").textContent = text;
        }
        function studioError(text) {
          $("studio-error").textContent = text;
        }
        function notifyStudio(text, tone = "info") {
          if (typeof starter.notify === "function")
            void starter.notify(text, { tone }).catch(() => studioError(text));
          else announce(text);
        }
        function retainStudio(dirty = true) {
          studioDirty ||= dirty;
          if (studioInvalid) return;
          if (working || current?.busy || current?.active === false) return;
          void retain(studioDirty || current?.dirty).catch(() =>
            studioError(
              tr(
                "草稿登记失败，请重试；当前内容仍在界面中。",
                "Could not retain the draft. Your work is still on this page.",
              ),
            ),
          );
        }
        function studioControls() {
          const blocked =
            studioInvalid ||
            working ||
            current?.busy ||
            current?.active === false;
          document
            .querySelectorAll(
              ".studio-scene input, .studio-scene select, .studio-scene textarea, .studio-scene button",
            )
            .forEach((node) => {
              node.disabled = !!blocked;
            });
          $("canvas-undo").disabled = !!blocked || canvasHistory.length === 0;
          $("canvas-remove").disabled = !!blocked || studio.nodes.length < 2;
          $("canvas-connect").disabled = !!blocked || studio.nodes.length < 2;
          $("lens-export").disabled = !!blocked || visibleRows().length === 0;
          $("flow-export").disabled = !!blocked || !flowResult?.length;
          $("flow-run").disabled = !!blocked || flowStep >= 0;
          $("lens-undo").disabled = !!blocked || dataHistory.length === 0;
        }
        function localizeStudio() {
          $("lens-table").setAttribute(
            "aria-label",
            tr("数据透镜数据表", "Data lens table"),
          );
          $("flow-table").setAttribute(
            "aria-label",
            tr("流程结果数据表", "Pipeline result table"),
          );
          document.querySelectorAll("[data-zh][data-en]").forEach((node) => {
            node.textContent =
              current?.locale === "en" ? node.dataset.en : node.dataset.zh;
          });
          $("studio-nav").setAttribute(
            "aria-label",
            tr("工作空间", "Workspaces"),
          );
          $("node-stage").setAttribute(
            "aria-label",
            tr("创意画布", "Idea canvas"),
          );
          $("motion-toggle").textContent = tr(
            studio.paused ? "继续动效" : "暂停动效",
            studio.paused ? "Resume motion" : "Pause motion",
          );
          $("motion-toggle").setAttribute(
            "aria-pressed",
            String(studio.paused),
          );
        }
        function cancelFlow(clearResult = false) {
          if (flowTimer !== null) clearTimeout(flowTimer);
          flowTimer = null;
          flowGeneration++;
          const wasRunning = flowStep >= 0;
          flowStep = -1;
          if (clearResult) flowResult = null;
          if (wasRunning || clearResult) {
            $("flow-status").textContent = tr(
              "参数或来源已更新，请重新运行。",
              "Source or settings changed. Run the pipeline again.",
            );
            document.querySelectorAll("[data-step]").forEach((node) => {
              delete node.dataset.state;
              node.querySelector(".step-state").textContent = "";
            });
          }
          $("flow-run").disabled = false;
          $("flow-export").disabled = !flowResult;
          if (clearResult) {
            $("flow-table").replaceChildren();
            $("flow-count").textContent = "— / —";
          }
        }
        function setScene(scene, persist = true) {
          if (!SCENES.includes(scene)) return;
          const changedScene = studio.scene !== scene;
          if (changedScene) {
            cancelFlow();
            stopMotion();
          }
          studio.scene = scene;
          panelVisible = true;
          visibility?.disconnect();
          visibility?.observe($("scene-" + scene));
          document.querySelectorAll(".studio-scene").forEach((node) => {
            node.hidden = node.id !== `scene-${scene}`;
          });
          document
            .querySelectorAll("#studio-nav [data-scene]")
            .forEach((node) => {
              node.setAttribute(
                "aria-selected",
                String(node.dataset.scene === scene),
              );
              node.tabIndex = node.dataset.scene === scene ? 0 : -1;
            });
          studioAnimation?.cancel();
          if (
            changedScene &&
            motionAllowed() &&
            !studio.paused &&
            typeof $("scene-" + scene).animate === "function"
          ) {
            studioAnimation = $("scene-" + scene).animate(
              [
                { opacity: 0.72, transform: "translateY(6px)" },
                { opacity: 1, transform: "none" },
              ],
              { duration: 220, easing: "cubic-bezier(.2,.8,.2,1)" },
            );
          }
          if (persist) retainStudio(false);
          studioControls();
        }
        $("studio-nav").onclick = (event) => {
          const button = event.target.closest("[data-scene]");
          if (button) setScene(button.dataset.scene);
        };
        $("studio-nav").onkeydown = (event) => {
          const index = SCENES.indexOf(
            event.target.closest("[data-scene]")?.dataset.scene,
          );
          if (
            index < 0 ||
            !["ArrowLeft", "ArrowRight", "Home", "End"].includes(event.key)
          )
            return;
          event.preventDefault();
          const next =
            event.key === "Home"
              ? 0
              : event.key === "End"
                ? SCENES.length - 1
                : (index +
                    (event.key === "ArrowRight" ? 1 : SCENES.length - 1)) %
                  SCENES.length;
          setScene(SCENES[next]);
          $("studio-tab-" + SCENES[next]).focus();
        };
        function canvasUndoPoint() {
          canvasHistory.push(
            JSON.stringify({
              nodes: studio.nodes,
              edges: studio.edges,
              selected: studio.selected,
            }),
          );
          if (canvasHistory.length > 20) canvasHistory.shift();
          $("canvas-undo").disabled = false;
        }
        const undo = create("button", tr("撤销", "Undo"));
        undo.id = "canvas-undo";
        undo.type = "button";
        undo.dataset.variant = "outline";
        undo.dataset.zh = "撤销";
        undo.dataset.en = "Undo";
        undo.disabled = true;
        $("canvas-arrange").before(undo);
        undo.onclick = () => {
          const previous = canvasHistory.pop();
          if (!previous) return;
          Object.assign(studio, JSON.parse(previous));
          undo.disabled = canvasHistory.length === 0;
          drawCanvas();
          retainStudio();
        };
        function drawLinks() {
          $("node-links").replaceChildren(
            ...studio.edges.map(([from, to]) => {
              const a = studio.nodes.find((node) => node.id === from),
                b = studio.nodes.find((node) => node.id === to);
              const ax = a.x * 9,
                ay = a.y * 4.4,
                bx = b.x * 9,
                by = b.y * 4.4,
                mid = (ax + bx) / 2;
              return svgNode("path", {
                d: `M${ax} ${ay} C${mid} ${ay},${mid} ${by},${bx} ${by}`,
                class: "connection-path flow-pulse",
              });
            }),
          );
        }
        function inspector() {
          const node =
            studio.nodes.find((item) => item.id === studio.selected) ??
            studio.nodes[0];
          studio.selected = node.id;
          if (document.activeElement !== $("node-title"))
            $("node-title").value = node.title;
          if (document.activeElement !== $("node-detail"))
            $("node-detail").value = node.detail;
          const previousTarget = $("node-target").value;
          $("node-target").replaceChildren(
            ...studio.nodes
              .filter((item) => item.id !== node.id)
              .map((item) => new Option(item.title || item.id, item.id)),
          );
          if (
            [...$("node-target").options].some(
              (option) => option.value === previousTarget,
            )
          )
            $("node-target").value = previousTarget;
          $("canvas-connect").disabled = studio.nodes.length < 2;
          $("canvas-remove").disabled = studio.nodes.length < 2;
          $("node-count").textContent = String(studio.nodes.length);
          $("edge-count").textContent = String(studio.edges.length);
          $("node-stage")
            .querySelectorAll(".canvas-node")
            .forEach((button) =>
              button.setAttribute(
                "aria-pressed",
                String(button.dataset.node === studio.selected),
              ),
            );
        }
        function drawCanvas() {
          $("node-stage").style.setProperty(
            "--canvas-height",
            Math.max(390, Math.ceil(studio.nodes.length / 4) * 160 + 100) +
              "px",
          );
          const previous = new Map(
            [...$("node-stage").querySelectorAll(".canvas-node")].map(
              (node) => [
                node.dataset.node,
                {
                  x: parseFloat(node.style.left),
                  y: parseFloat(node.style.top),
                },
              ],
            ),
          );
          canvasAnimations.forEach((animation) => animation.cancel());
          canvasAnimations.clear();
          $("node-stage")
            .querySelectorAll(".canvas-node")
            .forEach((node) => node.remove());
          studio.nodes.forEach((node) => {
            const button = create("button");
            button.type = "button";
            button.className = "canvas-node";
            button.dataset.surface = "control";
            button.dataset.node = node.id;
            button.dataset.tone = node.tone;
            const icon = create(
              "span",
              { violet: "◇", cyan: "⌁", rose: "✳", orange: "▥" }[node.tone],
            );
            icon.className = "node-icon";
            icon.setAttribute("aria-hidden", "true");
            const title = create("strong", node.title),
              detail = create("span", node.detail),
              port = create("i");
            title.className = "node-title";
            detail.className = "node-detail";
            port.className = "node-port";
            port.dataset.surface = "artwork";
            button.append(icon, title, detail, port);
            button.style.left = node.x + "%";
            button.style.top = node.y + "%";
            button.onclick = () => {
              studio.selected = node.id;
              inspector();
              retainStudio(false);
            };
            button.onpointerdown = (event) => {
              if (
                event.button !== 0 ||
                working ||
                current?.busy ||
                current?.active === false
              )
                return;
              studio.selected = node.id;
              inspector();
              button.focus({ preventScroll: true });
              drag = {
                id: node.id,
                pointer: event.pointerId,
                px: event.clientX,
                py: event.clientY,
                x: node.x,
                y: node.y,
                moved: false,
              };
              button.setPointerCapture?.(event.pointerId);
            };
            button.onpointermove = (event) => {
              if (
                !drag ||
                drag.id !== node.id ||
                drag.pointer !== event.pointerId
              )
                return;
              const bounds = $("node-stage").getBoundingClientRect();
              if (!bounds.width || !bounds.height) return;
              if (
                !drag.moved &&
                Math.hypot(event.clientX - drag.px, event.clientY - drag.py) < 3
              )
                return;
              if (!drag.moved) {
                canvasUndoPoint();
                drag.moved = true;
              }
              node.x = Math.max(
                12,
                Math.min(
                  88,
                  drag.x + ((event.clientX - drag.px) * 100) / bounds.width,
                ),
              );
              node.y = Math.max(
                16,
                Math.min(
                  84,
                  drag.y + ((event.clientY - drag.py) * 100) / bounds.height,
                ),
              );
              button.style.left = node.x + "%";
              button.style.top = node.y + "%";

                tr(
                  "无法恢复工作台草稿，原检查点已保留。请先从扩展工具导出当前会话，再新建会话。",
                  "This workspace draft cannot be restored. Its checkpoint is retained. Export the session from Extension tools, then start a new session.",
                ),
              );
            }
            studioLoaded = true;
            localizeStudio();
            drawCanvas();
            drawLens();
            $("data-editor").hidden = !studio.editorOpen;
            $("lens-edit").setAttribute(
              "aria-expanded",
              String(studio.editorOpen),
            );
            $("lens-source").value =
              studio.sourceDraft ?? JSON.stringify(studio.rows, null, 2);
            flowSettings();
            setScene(studio.scene, false);
          }
          if (studioLocale !== snapshot.locale) {
            studioLocale = snapshot.locale;
            localizeStudio();
            inspector();
            drawLens();
            flowSettings();
          }
          if (snapshot.active === false) {
            cancelFlow();
            studioAnimation?.cancel();
            if (drag) {
              const button = $("node-stage").querySelector(
                `[data-node="${drag.id}"]`,
              );
              if (button?.hasPointerCapture?.(drag.pointer))
                button.releasePointerCapture(drag.pointer);
              drag = null;
            }
          }
          syncMotion();
        }
        const visibility =
          typeof IntersectionObserver === "function"
            ? new IntersectionObserver(([entry]) => {
                panelVisible = entry.isIntersecting;
                syncMotion();
              })
            : null;
        visibility?.observe($("scene-canvas"));
        document.addEventListener("visibilitychange", syncMotion);
        document.addEventListener("visibilitychange", () => {
          if (document.hidden) cancelFlow();
        });
        reducedMotion?.addEventListener("change", syncMotion);
        window.addEventListener(
          "pagehide",
          () => {
            cancelFlow();
            studioAnimation?.cancel();
            stopMotion();
            visibility?.disconnect();
            reducedMotion?.removeEventListener("change", syncMotion);
            document.removeEventListener("visibilitychange", syncMotion);
          },
          { once: true },
        );
        starter.onChange((snapshot) => {
          if (current?.dirty && !snapshot.dirty && !working)
            studioDirty = false;
          current = snapshot;
          studioSnapshot(snapshot);
          render();
        });
      })();
    </script>
  </body>
</html>
